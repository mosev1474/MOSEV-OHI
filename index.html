<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MOSEV</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            color: white;
            font-family: Arial, sans-serif;
            background: #000;
            z-index: 9999;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #d4af37;
        }

        .text {
            font-size: 14px;
            opacity: .7;
        }

        .error {
            color: #ff5555;
            max-width: 90%;
            text-align: center;
            line-height: 1.8;
        }

        #site {
            border: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="logo">MOSEV</div>
        <div class="text">جاري تشغيل النظام...</div>
    </div>

    <iframe
        id="site"
        allow="clipboard-read; clipboard-write"
    ></iframe>

    <script>
        async function startMOSEV() {

            try {

                const response = await fetch(
                    "config.json?t=" + Date.now(),
                    {
                        cache: "no-store"
                    }
                );

                if (!response.ok) {
                    throw new Error("تعذر قراءة config.json");
                }

                const config = await response.json();

                if (!config.url) {
                    throw new Error("رابط MOSEV غير موجود");
                }

                const iframe = document.getElementById("site");
                const loading = document.getElementById("loading");

                iframe.src = config.url;

                iframe.onload = function () {
                    loading.style.display = "none";
                    iframe.style.display = "block";
                };

                setTimeout(() => {

                    if (loading.style.display !== "none") {
                        loading.innerHTML = `
                            <div class="logo">MOSEV</div>
                            <div class="error">
                                السيرفر بيجهز أو الرابط غير متاح حاليًا
                            </div>
                        `;
                    }

                }, 15000);

            } catch (error) {

                document.getElementById("loading").innerHTML = `
                    <div class="logo">MOSEV</div>
                    <div class="error">
                        حصل خطأ في الاتصال بالسيرفر
                        <br>
                        ${error.message}
                    </div>
                `;

                console.error(error);
            }
        }

        startMOSEV();
    </script>

</body>
</html>
